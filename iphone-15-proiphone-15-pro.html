<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gadbox - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="iphone-15-proiphone-15-pro.css">
</head>
<body class="bg-white">

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom py-3">
        <!-- container-fluid px-5 agar melebar rapi di 1920p seperti aslinya -->
        <div class="container-fluid px-md-5 d-flex align-items-center justify-content-between">
            
            <div class="d-flex align-items-center">
                <a class="navbar-brand" href="#">Gadbox</a>
                <a class="nav-link d-none d-md-block ms-4" href="#" style="font-size: 20px;">Kategori</a>
            </div>

            <!-- Search Bar kembali kotak dengan sudut sedikit melengkung -->
            <form class="flex-grow-1 mx-5 position-relative" role="search" id="searchForm" autocomplete="off" style="max-width: 800px;">
                <input class="form-control w-100 search-input" type="search" placeholder="Search" aria-label="Search" id="searchInput"/>
                <ul id="searchHistory" class="list-group position-absolute w-100 shadow-sm mt-1" style="display: none; z-index: 1000; top: 100%; left: 0; border-radius: 8px; overflow: hidden;"></ul>
            </form>

            <ul class="navbar-nav d-flex flex-row gap-4">
                <li class="nav-item"><a class="nav-link-custom active" href="Home.html">Home</a></li>
                <li class="nav-item"><a class="nav-link-custom" href="#">Category</a></li>
                <li class="nav-item"><a class="nav-link-custom" href="#">Cart</a></li>
                <li class="nav-item"><a class="nav-link-custom" href="#">Wishlist</a></li>
            </ul>
        </div>
    </nav>

    <!-- KONTEN UTAMA -->
    <main class="container-fluid px-md-5 mt-5">
        <div class="row gx-5">
            
            <!-- AREA KIRI: GAMBAR -->
            <div class="col-md-6 text-center">
                <img id="gambar-produk" src="image/iphone15pro_white_titanium_HD_tanpa_background.png" class="img-main-product" alt="iPhone 15 Pro">
                
                <div class="galeri d-flex justify-content-center gap-4 mt-4">
                    <img id="gambar-depan" src="image/iphone15pro_depan_HD_tanpa_background.png" alt="Tampak depan" class="galeri-img">
                    <img id="gambar-belakang" src="image/iphone15pro_belakang.png" alt="Tampak belakang" class="galeri-img">
                </div>
            </div>

            <!-- AREA KANAN: DETAIL PRODUK -->
            <div class="col-md-5 pt-3">
                <h1 class="card-title-custom" id="judul">iPhone 15 Pro</h1>
                <p class="card-sku mb-5">SKU: 8100122795</p>
                
                <h2 class="card-price" id="harga">Rp 21.000.000</h2>
                <p class="card-atau mb-1">atau</p>
                <p class="card-cicilan mb-5" id="cicilan">Rp 875.000/bln. untuk 24 bln.*</p>

                <!-- Model -->
                <div class="mb-4">
                    <p class="card-label">Model</p>
                    <div class="d-flex flex-column gap-3">
                        <button type="button" class="btn-subtle btn-model active text-start" data-group="model"
                                data-model="pro" data-nama="iPhone 15 Pro"
                                data-img="image/iphone15pro_white_titanium_HD_tanpa_background.png"
                                data-depan="image/iphone15pro_depan_HD_tanpa_background.png"
                                data-belakang="image/iphone15pro_belakang.png">iPhone 15 Pro</button>
                        
                        <button type="button" class="btn-subtle btn-model text-start" data-group="model"
                                data-model="promax" data-nama="iPhone 15 Pro Max"
                                data-img="image/iphone15promax_HD_tanpa_background.png"
                                data-depan="image/iphone15promax_natural_depan_HD_tanpa_background.png"
                                data-belakang="image/iphone15promax_natural_belakang_HD_tanpa_background.png">iPhone 15 Pro Max</button>
                    </div>
                </div>

                <!-- Kapasitas -->
                <div>
                    <p class="card-label">Kapasitas</p>
                    <div class="d-flex flex-wrap gap-3">
                        <button type="button" class="btn-subtle btn-kapasitas active flex-grow-1" data-group="kapasitas" id="btn-128" data-kapasitas="128">128 GB</button>
                        <button type="button" class="btn-subtle btn-kapasitas flex-grow-1" data-group="kapasitas" data-kapasitas="256">256 GB</button>
                        <button type="button" class="btn-subtle btn-kapasitas flex-grow-1" data-group="kapasitas" data-kapasitas="512">512 GB</button>
                        <button type="button" class="btn-subtle btn-kapasitas flex-grow-1" data-group="kapasitas" data-kapasitas="1024">1 TB</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Letakkan script JS Anda tepat di sini, sama persis seperti sebelumnya -->
    <script>
        // (Masukkan script JavaScript asli Anda di sini, tidak ada yang perlu diubah)
    </script>
</body>
</html>
